name: Release

# Cada merge a main publica una version: el bump sale de los commits
# convencionales desde el ultimo tag (ver el paso "Bump"), standard-version
# actualiza package.json y CHANGELOG.md, crea el tag
# y lo sube. Despues se despliega ese tag y se publica el GitHub Release con
# las notas del CHANGELOG.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: Tipo de bump (auto = segun los commits)
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

# Dos merges seguidos no deben calcular la misma version en paralelo.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # La punta de la rama, no github.sha: si un release anterior ya empujo
          # su commit, este run parte de ahi y el push no queda rechazado.
          ref: ${{ github.ref_name }}
          # Si main esta protegida, GITHUB_TOKEN no puede empujar el commit de
          # release: configurar RELEASE_TOKEN (PAT o GitHub App con bypass).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version, changelog and tag
        id: bump
        env:
          RELEASE_AS: ${{ github.event.inputs.release_as || 'auto' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Compatibilidad con el flujo manual (`yarn release:*` + push con
          # --follow-tags): si el commit ya es un release, se reutiliza su tag.
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$EXISTING_TAG" ]; then
            echo "HEAD ya tiene el tag $EXISTING_TAG; no se hace bump."
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # En 0.x standard-version convierte `feat` en patch. Se mantiene la
          # convencion del proyecto: feat (o breaking) -> minor, el resto ->
          # patch. Un major se pide a mano con workflow_dispatch.
          if [ "$RELEASE_AS" = auto ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*')
            if git log "${LAST_TAG}..HEAD" --format='%s%n%b' \
              | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE|^feat(\([^)]*\))?:'; then
              RELEASE_AS=minor
            else
              RELEASE_AS=patch
            fi
          fi

          # [skip ci] evita que el push del commit de release vuelva a disparar
          # este workflow cuando se usa RELEASE_TOKEN.
          yarn standard-version --release-as "$RELEASE_AS" \
            --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"

          TAG="v$(node -p "require('./package.json').version")"
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-firebase.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
    secrets: inherit

  github-release:
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          # Notas = la seccion de esta version en CHANGELOG.md (de su encabezado
          # hasta el encabezado de la version anterior).
          awk -v v="$VERSION" '
            /^#+ \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "Mantenimiento interno, sin cambios funcionales." > "$RUNNER_TEMP/notes.md"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
